<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教案评审智能体</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="#667eea" class="bi bi-book" viewBox="0 0 16 16">
                    <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.815V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.815C10.354 13.248 9.271 13.118 8 13.118c-1.272 0-2.354.13-3.288.815V2.687zM8 12.882c1.358 0 2.524.189 3.466.538.893.34 1.756.646 2.45.995v-2.257c-.851-.284-1.588-.62-2.15-.956-.562-.336-1.179-.557-1.828-.698V12.882zm0-8.721c-1.167 0-2.239.056-3.268.185-.95.126-1.719.363-2.34 1.035v2.257c.621-.672 1.38-1.01 2.233-1.184.852-.173 1.805-.273 2.896-.273s2.044.1 2.896.273c.853.174 1.612.512 2.233 1.184v-2.257c-.621-.672-1.39-.909-2.34-1.035C10.239 4.238 9.168 4.182 8 4.182z"/>
                </svg>
                教案评审智能体
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/history">历史记录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header fade-in-up">
            <h1>教案评审智能体</h1>
            <p class="text-muted" style="font-size: 1.1rem;">填写教案标题、适用年级和教案内容，系统将返回结构化评审结果与改进建议。</p>
        </div>

        {% if error_message %}
        <div class="alert alert-danger fade-in-up" role="alert">
            {{ error_message }}
        </div>
        {% endif %}

        <div class="card fade-in-up" style="animation-delay: 0.2s;">
            <div class="card-body">
                <h5 class="card-title" style="color: #2d3748; font-weight: bold;">提交教案评审</h5>
                <p class="text-muted" style="margin-bottom: 1.5rem;">建议尽量提供完整的教学目标、教学过程和评价设计，以获得更准确的反馈。</p>
                <form id="lesson-plan-form" action="/submit_essay" method="POST">
                    <div class="mb-3">
                        <label for="lesson-title" class="form-label">教案标题</label>
                        <input id="lesson-title" name="title" type="text" class="form-control" placeholder="例如：七年级英语《My School Day》阅读课教案" required>
                    </div>
                    <div class="mb-3">
                        <label for="grade-select" class="form-label">教案年级</label>
                        <select id="grade-select" name="grade" class="form-select" required>
                            <option value="">请选择年级</option>
                            <option value="幼儿园">幼儿园</option>
                            <option value="一年级">一年级</option>
                            <option value="二年级">二年级</option>
                            <option value="三年级">三年级</option>
                            <option value="四年级">四年级</option>
                            <option value="五年级">五年级</option>
                            <option value="六年级">六年级</option>
                            <option value="七年级">七年级</option>
                            <option value="八年级">八年级</option>
                            <option value="九年级">九年级</option>
                            <option value="中考">中考</option>
                            <option value="高一">高一</option>
                            <option value="高二">高二</option>
                            <option value="高三">高三</option>
                            <option value="高考">高考</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="lesson-content" class="form-label">教案内容</label>
                        <textarea id="lesson-content" name="content" class="form-control" placeholder="请填写完整教案内容，例如教学目标、教学重难点、教学过程、师生活动、板书设计和课后评价等。" required></textarea>
                    </div>
                    <div class="word-counter" id="word-counter">
                        内容统计：<span id="word-count" style="color: #667eea; font-weight: bold;">0</span>
                        <span id="field-status" class="text-danger">请完整填写全部字段</span>
                    </div>
                    <div class="mt-3 d-flex justify-content-end">
                        <button type="submit" id="submit-btn" class="btn btn-primary" disabled>提交评审</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <p class="text-muted" style="margin-bottom: 0;">© 2025 教案评审智能体 - 为教学设计提供高效评审支持</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const lessonTitle = document.getElementById('lesson-title');
        const lessonGrade = document.getElementById('grade-select');
        const lessonContent = document.getElementById('lesson-content');
        const wordCountEl = document.getElementById('word-count');
        const fieldStatusEl = document.getElementById('field-status');
        const submitBtn = document.getElementById('submit-btn');
        const wordCounterEl = document.getElementById('word-counter');

        lessonTitle.addEventListener('input', updateFormState);
        lessonGrade.addEventListener('change', updateFormState);
        lessonContent.addEventListener('input', updateFormState);

        function countTokens(content) {
            const englishWords = content.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g) || [];
            const cjkChars = content.match(/[\u4e00-\u9fff]/g) || [];
            return englishWords.length + cjkChars.length;
        }

        function updateFormState() {
            const count = countTokens(lessonContent.value);
            const isReady = lessonTitle.value.trim() && lessonGrade.value && lessonContent.value.trim();

            wordCountEl.style.transition = 'all 0.3s ease';
            wordCountEl.style.transform = 'scale(1.2)';
            setTimeout(() => {
                wordCountEl.style.transform = 'scale(1)';
            }, 200);

            wordCountEl.textContent = count;

            if (isReady) {
                submitBtn.disabled = false;
                fieldStatusEl.textContent = '字段已完整，可提交评审';
                fieldStatusEl.classList.remove('text-danger');
                fieldStatusEl.classList.add('text-success');
                wordCounterEl.style.backgroundColor = '#e6fffa';
                wordCounterEl.style.border = '1px solid #99f6e4';
            } else {
                submitBtn.disabled = true;
                fieldStatusEl.textContent = '请完整填写全部字段';
                fieldStatusEl.classList.remove('text-success');
                fieldStatusEl.classList.add('text-danger');
                wordCounterEl.style.backgroundColor = '#f8f9fa';
                wordCounterEl.style.border = 'none';
            }
        }

        document.getElementById('lesson-plan-form').addEventListener('submit', function() {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> 评审中...';
        });

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.fade-in-up').forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(30px)';

                setTimeout(() => {
                    el.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100 + (index * 200));
            });

            updateFormState();
        });
    </script>
</body>
</html>
